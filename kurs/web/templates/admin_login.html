{% extends "base.html" %}
{% block innhold %}
<div class="kort" style="max-width:380px; margin:0 auto">
  <h1>Logg inn</h1>
  <p class="sub">Logg inn med din personlige brukerkonto.{% if demo %} Demo: brukernavn <code>admin</code>, passord <code>demo</code>{% endif %}</p>
  <form method="post">
    <label>Brukernavn</label><input name="brukernavn" autofocus autocapitalize="off" autocomplete="username">
    <label>Passord</label><input type="password" name="passord" autocomplete="current-password">
    <p style="margin-top:14px"><button style="width:100%">Logg inn</button></p>
  </form>
</div>
{% endblock %}
